name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # todo dia, 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright (API + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Sem os secrets (ex.: PR de fork) os testes logados pulam e o resto roda.
      QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
      QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar a suíte contra a homologação
        run: npm test

      - name: Relatório HTML como artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Preparar o relatório para o GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  pages:
    name: Publicar relatório no GitHub Pages
    needs: test
    # Só na main; publica também quando algum teste falha, que é quando o relatório mais importa.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
